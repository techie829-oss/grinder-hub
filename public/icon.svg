<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>

    <!-- Solar / Gold Radial Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Millstone Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Metallic Highlight -->
    <linearGradient id="metalRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Solar Rays Filter Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Sun Glow Background -->
  <circle cx="256" cy="256" r="220" fill="url(#sunGlow)"/>

  <!-- 12 Solar / Chakki Rays (Millstone Motion & Solar Power) -->
  <g stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.45">
    <line x1="256" y1="46" x2="256" y2="76"/>
    <line x1="256" y1="436" x2="256" y2="466"/>
    <line x1="46" y1="256" x2="76" y2="256"/>
    <line x1="436" y1="256" x2="466" y2="256"/>
    <line x1="108" y1="108" x2="129" y2="129"/>
    <line x1="383" y1="383" x2="404" y2="404"/>
    <line x1="108" y1="404" x2="129" y2="383"/>
    <line x1="383" y1="129" x2="404" y2="108"/>
  </g>

  <!-- Outer Millstone Ring with Grooves -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#goldGrad)" stroke-width="14" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#metalRing)" stroke-width="14"/>

  <!-- Chakki Stone Texture Notches (Traditional Flour Mill Grooves) -->
  <g stroke="#ffffff" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="14 18">
    <circle cx="256" cy="256" r="148" fill="none"/>
  </g>

  <!-- Center Core Disc -->
  <circle cx="256" cy="256" r="126" fill="#1e1b4b" stroke="url(#goldGrad)" stroke-width="5"/>

  <!-- Golden Wheat Ears (Left & Right Wreath Motif) -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <!-- Left Stalk Grains -->
    <path d="M 174 270 C 160 258 160 242 174 234 C 182 248 180 262 174 270 Z"/>
    <path d="M 180 230 C 168 218 170 202 184 196 C 190 210 188 224 180 230 Z"/>
    <path d="M 194 194 C 184 182 188 168 202 164 C 206 178 202 190 194 194 Z"/>
    <!-- Right Stalk Grains -->
    <path d="M 338 270 C 352 258 352 242 338 234 C 330 248 332 262 338 270 Z"/>
    <path d="M 332 230 C 344 218 342 202 328 196 C 322 210 324 224 332 230 Z"/>
    <path d="M 318 194 C 328 182 324 168 310 164 C 306 178 310 190 318 194 Z"/>
  </g>

  <!-- Central Modern Typography Glyph: 'च' (Chakki) in Crisp Pure Gold -->
  <text x="256" y="328"
        font-family="'Noto Sans Devanagari', 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="192"
        font-weight="900"
        text-anchor="middle"
        fill="url(#goldGrad)"
        filter="url(#softGlow)">च</text>
  <text x="256" y="328"
        font-family="'Noto Sans Devanagari', 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="192"
        font-weight="900"
        text-anchor="middle"
        fill="#ffffff"
        opacity="0.35">च</text>
</svg>
