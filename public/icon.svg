<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Midnight Royal Navy to Indigo -->
    <linearGradient id="tmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Radiant Gold Metal Gradient -->
    <linearGradient id="tmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Emerald Teal Accent Gradient -->
    <linearGradient id="tmEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Soft Ambient Radial Glow -->
    <radialGradient id="tmGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Glow Filter -->
    <filter id="tmSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded App Icon Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#tmBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#tmGold)" stroke-width="2.5" stroke-opacity="0.35"/>

  <!-- Radial Golden / Emerald Ambient Glow -->
  <circle cx="256" cy="240" r="210" fill="url(#tmGlow)"/>

  <!-- Outer Scale Calibration Ring (Symbols of precision weight measurement) -->
  <circle cx="256" cy="240" r="172" fill="none" stroke="url(#tmGold)" stroke-width="3" stroke-opacity="0.25"/>
  <circle cx="256" cy="240" r="162" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.2" stroke-dasharray="8 12"/>

  <!-- Precision Beam Balance / Tarazu (तौल) Motif at Top -->
  <g filter="url(#tmSoftGlow)">
    <!-- Central Fulcrum & Suspension Ring -->
    <circle cx="256" cy="116" r="10" fill="none" stroke="url(#tmGold)" stroke-width="3.5"/>
    <path d="M 256 126 L 256 142" stroke="url(#tmGold)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Horizontal Balance Beam -->
    <path d="M 152 146 Q 256 138 360 146" fill="none" stroke="url(#tmGold)" stroke-width="5" stroke-linecap="round"/>

    <!-- Left Scale Pan Suspensions & Pan -->
    <path d="M 152 146 L 132 186 M 152 146 L 172 186" stroke="url(#tmGold)" stroke-width="2" stroke-opacity="0.75"/>
    <path d="M 124 188 Q 152 202 180 188" fill="none" stroke="url(#tmGold)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Right Scale Pan Suspensions & Pan -->
    <path d="M 360 146 L 340 186 M 360 146 L 380 186" stroke="url(#tmGold)" stroke-width="2" stroke-opacity="0.75"/>
    <path d="M 332 188 Q 360 202 388 188" fill="none" stroke="url(#tmGold)" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Left Golden Crop / Wheat Ear (माल - Grain & Commodity) -->
  <g fill="url(#tmGold)" opacity="0.85">
    <path d="M 136 260 C 122 248 122 232 136 224 C 144 238 142 252 136 260 Z"/>
    <path d="M 142 220 C 130 208 132 192 146 186 C 152 200 150 214 142 220 Z"/>
    <path d="M 156 184 C 146 172 150 158 164 154 C 168 168 164 180 156 184 Z"/>
  </g>

  <!-- Right Golden Crop / Wheat Ear (माल - Agricultural & Trade) -->
  <g fill="url(#tmGold)" opacity="0.85">
    <path d="M 376 260 C 390 248 390 232 376 224 C 368 238 370 252 376 260 Z"/>
    <path d="M 370 220 C 382 208 380 192 366 186 C 360 200 362 214 370 220 Z"/>
    <path d="M 356 184 C 366 172 362 158 348 154 C 344 168 348 180 356 184 Z"/>
  </g>

  <!-- Central Emblem: Iconic Devanagari 'त' (तौल-माल) in Radiant Sculpted Gold -->
  <text x="256" y="324"
        font-family="'Noto Sans Devanagari', 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="160"
        font-weight="900"
        text-anchor="middle"
        fill="url(#tmGold)"
        filter="url(#tmSoftGlow)">त</text>
  <text x="256" y="324"
        font-family="'Noto Sans Devanagari', 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="160"
        font-weight="900"
        text-anchor="middle"
        fill="#ffffff"
        opacity="0.3">त</text>

  <!-- Brand Typography: TOLMAAL by SOLIDRIX -->
  <text x="256" y="412"
        font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="34"
        font-weight="900"
        letter-spacing="5"
        text-anchor="middle"
        fill="#ffffff">TOLMAAL</text>

  <text x="256" y="438"
        font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="14"
        font-weight="700"
        letter-spacing="3"
        text-anchor="middle"
        fill="url(#tmEmerald)">BY SOLIDRIX</text>
</svg>
