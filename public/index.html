<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>तौल-माल (TolMaal) — हर दुकान और व्यापार का अपना हिसाब</title>
  <meta name="description" content="गल्ला मंडी, तेल घानी, पशु आहार, सुविधाएं और छोटे-बड़े व्यापार के लिए टोकन, खरीद-बिक्री और उधार का आसान सिस्टम।">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="तौल-माल">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css?v=2.5.9">
</head>
<body>
  <div id="root" class="root">
    <div class="boot">
      <img src="/icon.svg" width="72" height="72" class="boot-mark" alt="तौल-माल लोगो" style="border:none;box-shadow:0 8px 24px rgba(245,158,11,0.35);">
      <p style="font-weight:700;margin-top:12px;color:#0f172a;font-size:15px;">तौल-माल हिसाब खुल रहा है…</p>
    </div>
  </div>
  <div id="modal"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="print" class="print-area"></div>
  <script type="module" src="/app.js?v=2.5.9"></script>
  <script>
    // Live Auto-Upgrade Engine: Automatic background download & instant activation without re-installing APK
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      // Only reload if a service worker was ALREADY controlling the page when it loaded.
      // If controller is null on load, this is the first install / claim — DO NOT reload!
      const hadController = Boolean(navigator.serviceWorker.controller);

        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!hadController) return;
          if (refreshing) return;
          refreshing = true;
          console.log(
            "[TolMaal Auto-Upgrade] New server version activated, reloading...",
          );
          window.location.reload();
        });

        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }

      // Safety fallback: only if the page completely fails to initialize after 12 seconds
      setTimeout(() => {
        const bootEl = document.querySelector(".boot");
        if (
          bootEl &&
          !window.__appBooted &&
          !window.location.search.includes("fresh")
        ) {
          console.warn("[TolMaal] App boot slow, retrying cleanly...");
          window.location.search = "?fresh=" + Date.now();
        }
      }, 12000);
    </script>
  </body>
</html>
