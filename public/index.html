<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>चक्की बुक — हर दुकान का अपना हिसाब</title>
  <meta name="description" content="आटा चक्की, मसाला पिसाई, तेल घानी और छोटे काम-धंधे के लिए टोकन, हिसाब और उधार का आसान सिस्टम।">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="चक्की बुक">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css?v=2.2.0">
</head>
<body>
  <div id="root" class="root">
    <div class="boot">
      <img src="/icon.svg" width="64" height="64" class="boot-mark" alt="चक्की बुक लोगो" style="border:none;box-shadow:0 8px 24px rgba(245,158,11,0.35);">
      <p style="font-weight:600;margin-top:10px;">हिसाब खुल रहा है…</p>
    </div>
  </div>
  <div id="modal"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="print" class="print-area"></div>
  <script type="module" src="/app.js?v=2.2.0"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=2.2.0').then(reg => {
          reg.update();
        }).catch(() => {});
      });
    }

    // Auto-recovery: If boot screen hangs for more than 3.5s due to stale browser cache, self-heal
    setTimeout(() => {
      const bootEl = document.querySelector('.boot');
      if (bootEl && !window.__appBooted) {
        console.warn('Boot freeze detected. Clearing stale cache and auto-reloading...');
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(regs => {
            for (let r of regs) r.unregister();
          });
        }
        if ('caches' in window) {
          caches.keys().then(keys => {
            for (let k of keys) caches.delete(k);
          });
        }
        setTimeout(() => {
          window.location.search = '?fresh=' + Date.now();
        }, 500);
      }
    }, 3500);
  </script>
</body>
</html>
