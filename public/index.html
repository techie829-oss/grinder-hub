<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>तौल-माल (TolMaal) — हर दुकान और व्यापार का अपना हिसाब</title>
  <meta name="description" content="गल्ला मंडी, तेल घानी, पशु आहार, सुविधाएं और छोटे-बड़े व्यापार के लिए टोकन, खरीद-बिक्री और उधार का आसान सिस्टम।">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="तौल-माल">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css?v=2.5.3">
</head>
<body>
  <div id="root" class="root">
    <div class="boot">
      <img src="/icon.svg" width="72" height="72" class="boot-mark" alt="तौल-माल लोगो" style="border:none;box-shadow:0 8px 24px rgba(245,158,11,0.35);">
      <p style="font-weight:700;margin-top:12px;color:#0f172a;font-size:15px;">तौल-माल हिसाब खुल रहा है…</p>
    </div>
  </div>
  <div id="modal"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="print" class="print-area"></div>
  <script type="module" src="/app.js?v=2.5.3"></script>
  <script>
    // Live Auto-Upgrade Engine: Automatic background download & instant activation without re-installing APK
    if ('serviceWorker' in navigator) {
      let refreshing = false;

      // When a new service worker takes over, reload to apply the latest upgrade immediately
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          console.log('[TolMaal Auto-Upgrade] New server version activated, reloading...');
          window.location.reload();
        }
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=2.5.3').then((reg) => {
          // Immediately check for updates on load
          reg.update();

          // Check for updates when user returns to app
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
              reg.update();
            }
          });

          // Periodic background check every 15 minutes
          setInterval(() => {
            reg.update();
          }, 15 * 60 * 1000);
        }).catch(() => {});
      });
    }

    // Auto-recovery: If boot screen hangs for more than 3.5s due to stale browser cache, self-heal
    setTimeout(() => {
      const bootEl = document.querySelector('.boot');
      if (bootEl && !window.__appBooted) {
        console.warn('Boot freeze detected. Clearing stale cache and auto-reloading...');
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(regs => {
            for (let r of regs) r.unregister();
          });
        }
        if ('caches' in window) {
          caches.keys().then(keys => {
            for (let k of keys) caches.delete(k);
          });
        }
        setTimeout(() => {
          window.location.search = '?fresh=' + Date.now();
        }, 500);
      }
    }, 3500);
  </script>
</body>
</html>
